services:
  ychat-pg:
    image: postgres:17-alpine
    container_name: ychat-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    env_file:
      - ./.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ychat_pgdata:/var/lib/postgresql/data
    networks:
      - default
  ychat-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ychat-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "${API_PORT}:4000"
    depends_on:
      - ychat-pg
    networks:
      - default

volumes:
  ychat_pgdata:

networks:
  default:
    driver: bridge
    name: ychat_net
